# Builds the game for every platform and puts the builds straight into a GitHub Release (no
# workflow artifacts are kept). Runs on a pushed tag `v*`, or by hand with a tag name.
name: release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (made if missing), e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  PACK_JOBS: "4"
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Make the release
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "Builds for Windows, Linux, macOS and Android." --target "$GITHUB_SHA"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "desktop-${{ matrix.name }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Pack the assets
        shell: bash
        run: |
          pip install pillow soundfile
          python -X utf8 tools/pack_assets.py desktop
      - name: Build
        shell: bash
        run: |
          # the Steam library sits beside the game, and the game finds it there
          case "${{ matrix.name }}" in
            linux) export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN' ;;
            macos) export RUSTFLAGS='-C link-arg=-Wl,-rpath,@executable_path' ;;
          esac
          export GAME_VERSION="${TAG#v}"
          cargo build --release -p tropa
      - name: Lay out the game
        shell: bash
        run: |
          out=target/dist/TropaVNav
          mkdir -p "$out"
          steam=$(ls -d target/release/build/steamworks-sys-*/out | head -1)
          case "${{ matrix.name }}" in
            windows) cp "$steam/steam_api64.dll" target/release/ ;;
            linux) cp target/release/tropa "$steam/libsteam_api.so" "$out/" ;;
            macos) cp target/release/tropa "$steam/libsteam_api.dylib" "$out/" ;;
          esac
          if [ "${{ matrix.name }}" != windows ]; then
            cp -r target/pack/desktop/assets "$out/assets"
          fi
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=$ver tools\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $env:TAG (Get-ChildItem target\dist\*.exe).FullName --clobber
      - name: Upload
        if: matrix.name != 'windows'
        shell: bash
        run: |
          cd target/dist
          tar -czf "TropaVNav-${{ matrix.name }}.tar.gz" TropaVNav
          gh release upload "$TAG" "TropaVNav-${{ matrix.name }}.tar.gz" --clobber -R "$GITHUB_REPOSITORY"

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the toolchain is the one rust-toolchain.toml pins; the phone's target is added to it
      - name: Rust for Android
        run: rustup target add aarch64-linux-android
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "android-aarch64"
      - name: Cache cargo-apk binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: ${{ runner.os }}-cargo-apk-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pack the assets
        run: |
          pip install pillow soundfile
          python -X utf8 tools/pack_assets.py mobile
      - name: Build the APK
        run: |
          which cargo-apk || cargo install cargo-apk --locked
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          # Use persistent release keystore so Android allows updates without signature mismatch
          if [ -f tools/release.keystore ]; then
            export CARGO_APK_RELEASE_KEYSTORE="$PWD/tools/release.keystore"
          else
            keytool -genkeypair -keystore release.keystore -alias tropa -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tropapass -keypass tropapass -dname "CN=Tropa v Nav"
            export CARGO_APK_RELEASE_KEYSTORE="$PWD/release.keystore"
          fi
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=tropapass
          cargo apk build --release -p tropa-android
      - name: Upload
        run: |
          apk=$(find target/release/apk -name '*.apk' | head -1)
          cp "$apk" TropaVNav-android.apk
          gh release upload "$TAG" TropaVNav-android.apk --clobber -R "$GITHUB_REPOSITORY"
